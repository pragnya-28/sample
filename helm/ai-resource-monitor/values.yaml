replicaCount: 2

image:
  repository: kyma-ai-resource-monitor
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

app:
  env:
    SECRET_KEY: "kyma-demo-secret"
    APP_ENV: "production"
